name: Build marketplace packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-marketplace.txt
      - name: Verify source and tests
        shell: pwsh
        run: |
          python scripts/check-release-safety.py
          npm ci
          npm run check
          npm run lint
          python -m pip install -r backend/requirements-marketplace.txt pytest
          python -m pytest backend/tests/test_ai_settings.py backend/tests/test_auth_cookie.py backend/tests/test_portfolio_safety.py backend/tests/test_research_logic.py -q
          Push-Location plugins/dsh-portfolio-os
          npm test
          Pop-Location
      - name: Build runtime and npm packages
        shell: pwsh
        run: ./scripts/pack-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-os-marketplace-windows
          path: |
            runtime-package/*.tgz
            plugins/dsh-portfolio-os/*.tgz
            RELEASE-SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runtime-package/*.tgz
            plugins/dsh-portfolio-os/*.tgz
            RELEASE-SHA256SUMS.txt
